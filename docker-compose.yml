services:
  db:
    image: postgres:17-alpine
    container_name: auth-db
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD:  authpass123
      POSTGRES_DB: authdb
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - microservices-network
 
  api:
    build: .
    container_name: auth-api
    environment: 
      - APP_ENV=docker
      - DATABASE_URL=postgresql+psycopg2://authuser:authpass123@auth-db:5432/authdb
      - RABBIT_URL=amqps://ykvaygzy:Kg8o0HCEw9hRygtPpnQ3bjWv7N9KU0xZ@stingray.rmq.cloudamqp.com/ykvaygzy
      - SECRET_KEY=JAMIESKEY
      - ADMIN_EMAIL=G00419525@atu.ie
      - ADMIN_PASSWORD=password
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    restart: unless-stopped
    networks: 
      - microservices-network

  worker:
    build: .
    container_name: auth-worker
    environment:
      - APP_ENV=docker
      - DATABASE_URL=postgresql+psycopg2://authuser:authpass123@auth-db:5432/authdb
      - RABBIT_URL=amqps://ykvaygzy:Kg8o0HCEw9hRygtPpnQ3bjWv7N9KU0xZ@stingray.rmq.cloudamqp.com/ykvaygzy
    depends_on:
      db: 
        condition: service_healthy
    command: python worker.py
    restart: unless-stopped
    networks: 
      - microservices-network

volumes:
  auth-postgres-data: 

networks:
  microservices-network:
    external: true